[package]
name = "nyx-store"
version = "0.1.0"
edition = "2024"
description = "A native app store for Omarchy with source-preserving package management"
license = "GPL-3.0-or-later"
repository = "https://github.com/design-nexus/nyx-store"

[dependencies]
nyx-catalog = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "a1af19d296315e8961d9488dd8c45638f44d598d" }
nyx-system-proto = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "a1af19d296315e8961d9488dd8c45638f44d598d" }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "32f0c5e154fc44c763b8ecd80d35a3b298723afa" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "4f8e16d6ae3dbc2a14091271e3b6bb29902c0df4" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "4f8e16d6ae3dbc2a14091271e3b6bb29902c0df4" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
alpm = "5.0.2"
alpm-utils = "5.0.0"
anyhow = "1"
async-channel = "2"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1.6"
ureq = { version = "3", features = ["json"] }

[[bin]]
name = "nyx-store"
path = "src/main.rs"

[[bin]]
name = "nyx-store-helper"
path = "src/bin/nyx-store-helper.rs"
