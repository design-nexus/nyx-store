[package]
name = "nyx-store"
version = "0.1.0"
edition = "2024"
description = "A native app store for Omarchy with source-preserving package management"
license = "GPL-3.0-or-later"
repository = "https://github.com/design-nexus/nyx-store"

[dependencies]
nyx-catalog = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "3f3c454cdf34cfce571a5ff3802a25817e9301f9" }
nyx-system-proto = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "3f3c454cdf34cfce571a5ff3802a25817e9301f9" }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
alpm = "5.0.2"
alpm-utils = "5.0.0"
anyhow = "1"
async-channel = "2"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1.6"
ureq = { version = "3", features = ["json"] }

[[bin]]
name = "nyx-store"
path = "src/main.rs"

[[bin]]
name = "nyx-store-helper"
path = "src/bin/nyx-store-helper.rs"
